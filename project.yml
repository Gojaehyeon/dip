name: Dip
options:
  bundleIdPrefix: com.tntlabs
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: RP5GZ99V95
    CODE_SIGN_STYLE: Automatic
targets:
  Dip:
    type: application
    platform: iOS
    sources: [Dip, Shared]
    dependencies:
      - target: DipWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tntlabs.dip
        INFOPLIST_KEY_CFBundleDisplayName: Dip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Dip/Dip.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.tntlabs.dip]
    info:
      path: Dip/Info.plist
      properties:
        CFBundleDisplayName: Dip
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
  DipWidget:
    type: app-extension
    platform: iOS
    sources: [DipWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tntlabs.dip.widget
    entitlements:
      path: DipWidget/DipWidget.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.tntlabs.dip]
    info:
      path: DipWidget/Info.plist
      properties:
        CFBundleDisplayName: Dip
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Dip:
    build:
      targets:
        Dip: all
    run:
      config: Debug
